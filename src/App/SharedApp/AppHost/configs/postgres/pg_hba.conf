# PostgreSQL client authentication for FrostStream's private container network.
# The replication rules exist because physical-backup tooling uses the replication
# protocol, which is not covered by a normal "host all all" database rule.
#
# The peer rule lets pgBackRest (running as OS user postgres, uid 999, in either
# the postgres or backupservice container via the shared socket volume) connect
# without a password; BackupService also exports PGPASSWORD as a fallback for
# non-default POSTGRES_USER values.
local   all             postgres                                peer
local   all             all                                     scram-sha-256
host    replication     all             0.0.0.0/0               scram-sha-256
host    replication     all             ::/0                    scram-sha-256
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256

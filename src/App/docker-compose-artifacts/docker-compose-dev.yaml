services:
  aspire-docker-demo-dashboard:
    container_name: froststream-aspire-docker-demo-dashboard
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  nats:
    container_name: froststream-nats
    image: "docker.io/library/nats:2.14"
    command:
      - "--user"
      - "nats"
      - "--pass"
      - "${NATS_PASSWORD}"
      - "-c"
      - "/etc/nats/nats.conf"
    expose:
      - "4222"
      - "8222"
      - "9222"
    volumes:
      - type: "bind"
        target: "/etc/nats/nats.conf"
        source: "../AppHost/configs/nats/nats-server.conf"
        read_only: true
      - type: "bind"
        target: "/etc/nats/certs/ws-cert.pem"
        source: "../AppHost/configs/nats/certs/ws-cert.pem"
        read_only: true
      - type: "bind"
        target: "/etc/nats/certs/ws-key.pem"
        source: "../AppHost/configs/nats/certs/ws-key.pem"
        read_only: true
    networks:
      - "aspire"
  nats-ui:
    container_name: froststream-nats-ui
    image: "klinux/nats-ui:0.4.0"
    environment:
      PORT: "8080"
      BASE_URL: "http://localhost:25700"
      NATS_URL: "nats://nats:${NATS_PASSWORD}@nats:4222"
      ADMIN_USER: "${NATS_UI_ADMIN_USER}"
      ADMIN_PASS: "${NATS_UI_ADMIN_PASS}"
      JWT_SECRET: "${NATS_UI_JWT_SECRET}"
      ConnectionStrings__nats: "nats://nats:${NATS_PASSWORD}@nats:4222"
      NATS_HOST: "nats"
      NATS_PORT: "4222"
      NATS_USERNAME: "nats"
      NATS_PASSWORD: "${NATS_PASSWORD}"
      NATS_URI: "nats://nats:${NATS_PASSWORD}@nats:4222"
    ports:
      - "25700:8080"
    networks:
      - "aspire"
  postgres:
    container_name: froststream-postgres
    image: "localhost/froststream-postgres:latest"
    pull_policy: "build"
    build:
      context: "../.."
      dockerfile: "App/PostgresServer/Dockerfile"
    command:
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "25500:5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "froststream-postgres-data"
        read_only: false
      - type: "volume"
        target: "/var/run/postgresql"
        source: "froststream-postgres-socket"
        read_only: false
      - type: "bind"
        target: "/etc/postgresql/postgresql.conf"
        source: "../AppHost/configs/postgres/postgresql.conf"
        read_only: true
      - type: "bind"
        target: "/etc/postgresql/pg_hba.conf"
        source: "../AppHost/configs/postgres/pg_hba.conf"
        read_only: true
      - type: "bind"
        target: "/etc/pgbackrest/pgbackrest.conf"
        source: "../AppHost/configs/pgbackrest/pgbackrest.conf"
        read_only: true
      - type: "bind"
        target: "/backups"
        source: "${FROSTSTREAM_BACKUP_ROOT:-./backups}"
    depends_on:
      backup-init:
        condition: "service_completed_successfully"
    networks:
      - "aspire"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER} -d postgres"
      interval: "5s"
      timeout: "5s"
      retries: 10
      start_period: "20s"
  backup-init:
    container_name: froststream-backup-init
    image: "docker.io/library/postgres:18.3"
    command:
      - "-c"
      - "mkdir -p /backups/pgbackrest /backups/openbao /backups/jobs && chown -R 999:999 /backups && echo 'backup-init: done'"
    entrypoint:
      - "/bin/bash"
    volumes:
      - type: "bind"
        target: "/backups"
        source: "${FROSTSTREAM_BACKUP_ROOT:-./backups}"
    networks:
      - "aspire"
  dbgate:
    container_name: froststream-dbgate
    image: "docker.io/dbgate/dbgate:6.1.4"
    environment:
      CONNECTIONS: "con1"
      LABEL_con1: "postgres"
      SERVER_con1: "postgres"
      USER_con1: "${POSTGRES_USER}"
      PASSWORD_con1: "${POSTGRES_PASSWORD}"
      PORT_con1: "5432"
      ENGINE_con1: "postgres@dbgate-plugin-postgres"
    ports:
      - "25600:3000"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  postgres-init:
    container_name: froststream-postgres-init
    image: "docker.io/library/postgres:18.3"
    command:
      - "-c"
      - "set -eu\nuntil pg_isready -q; do echo 'postgres-init: waiting for postgres'; sleep 1; done\nfor db in froststreamdb authentikdb openfgadb; do\n  if [ \"$(psql -tAc \"SELECT 1 FROM pg_database WHERE datname = '$$db'\")\" = '1' ]; then\n    echo \"postgres-init: database $$db already exists\"\n  else\n    echo \"postgres-init: creating database $$db\"\n    createdb \"$$db\"\n  fi\ndone\necho 'postgres-init: done'"
    entrypoint:
      - "/bin/bash"
    environment:
      PGHOST: "postgres"
      PGPORT: "5432"
      PGDATABASE: "postgres"
      PGUSER: "${POSTGRES_USER}"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: "service_healthy"
    networks:
      - "aspire"
  openbao:
    container_name: froststream-openbao
    image: "openbao/openbao:2.5.5"
    command:
      - "server"
      - "-config=/openbao/openbao.hcl"
    environment:
      OPENBAO_APP_TOKEN: "${OPENBAO_TOKEN}"
    ports:
      - "25400:8200"
    volumes:
      - type: "volume"
        target: "/openbao/file"
        source: "openbao-data"
        read_only: false
      - type: "bind"
        target: "/openbao/openbao.hcl"
        source: "../AppHost/configs/openbao/openbao.hcl"
        read_only: true
    networks:
      - "aspire"
    healthcheck:
      test:
        - "CMD"
        - "bao"
        - "status"
      interval: "10s"
      timeout: "5s"
      retries: 30
      start_period: "10s"
  openbao-bootstrap:
    container_name: froststream-openbao-bootstrap
    image: "openbao/openbao:2.5.5"
    command:
      - "-c"
      - "set -eu\n\nbootstrap_file=\"/bootstrap/init.env\"\nlegacy_bootstrap_file=\"/openbao/file/.bootstrap/init.env\"\n\nwrite_bootstrap_file() {\n  temp_file=\"$${bootstrap_file}.tmp\"\n  umask 077\n  printf 'UNSEAL_KEY=%s\\nROOT_TOKEN=%s\\n' \"$1\" \"$2\" > \"$$temp_file\"\n  mv \"$$temp_file\" \"$$bootstrap_file\"\n}\n\nuntil bao operator init -status >/dev/null 2>&1 || [ \"$?\" -eq 2 ]; do sleep 1; done\nif bao operator init -status >/dev/null 2>&1; then\n  if [ ! -f \"$$bootstrap_file\" ]; then\n    if [ -f \"$$legacy_bootstrap_file\" ]; then\n      echo 'openbao-bootstrap: migrating recovery material from the data volume'\n      temp_file=\"$${bootstrap_file}.tmp\"\n      umask 077\n      cat \"$$legacy_bootstrap_file\" > \"$$temp_file\"\n      mv \"$$temp_file\" \"$$bootstrap_file\"\n      rm -f \"$$legacy_bootstrap_file\"\n      rmdir /openbao/file/.bootstrap 2>/dev/null || true\n    else\n      echo 'openbao-bootstrap: vault is initialized but /bootstrap/init.env is missing; restore it from backup before starting dependent services' >&2\n      exit 1\n    fi\n  elif [ -f \"$$legacy_bootstrap_file\" ]; then\n    echo 'openbao-bootstrap: removing legacy recovery material from the data volume'\n    rm -f \"$$legacy_bootstrap_file\"\n    rmdir /openbao/file/.bootstrap 2>/dev/null || true\n  fi\n  echo 'openbao-bootstrap: using existing initialization'\nelse\n  echo 'openbao-bootstrap: initializing development storage'\n  output=\"$(bao operator init -key-shares=1 -key-threshold=1)\"\n  unseal_key=\"$(printf '%s\\n' \"$$output\" | sed -n 's/^Unseal Key 1: //p')\"\n  root_token=\"$(printf '%s\\n' \"$$output\" | sed -n 's/^Initial Root Token: //p')\"\n  write_bootstrap_file \"$$unseal_key\" \"$$root_token\"\nfi\n. \"$$bootstrap_file\"\nif bao status >/dev/null 2>&1; then\n  echo 'openbao-bootstrap: already unsealed'\nelse\n  bao operator unseal \"$$UNSEAL_KEY\" >/dev/null\nfi\nif ! BAO_TOKEN=\"$$OPENBAO_APP_TOKEN\" bao token lookup >/dev/null 2>&1; then\n  BAO_TOKEN=\"$$ROOT_TOKEN\" bao token create -id=\"$$OPENBAO_APP_TOKEN\" -policy=root -no-default-policy >/dev/null\nfi\nif ! BAO_TOKEN=\"$$ROOT_TOKEN\" bao secrets list -format=json | grep -q '\"secret/\"'; then\n  BAO_TOKEN=\"$$ROOT_TOKEN\" bao secrets enable -path=secret kv-v2 >/dev/null\nfi\necho 'openbao-bootstrap: ready'"
    entrypoint:
      - "/bin/sh"
    environment:
      BAO_ADDR: "http://openbao:8200"
      OPENBAO_APP_TOKEN: "${OPENBAO_TOKEN}"
    volumes:
      - type: "volume"
        target: "/openbao/file"
        source: "openbao-data"
        read_only: false
      - type: "bind"
        target: "/bootstrap"
        source: "${FROSTSTREAM_OPENBAO_BOOTSTRAP_ROOT:-./openbao-bootstrap}"
    depends_on:
      openbao:
        condition: "service_started"
    networks:
      - "aspire"
  typesense:
    container_name: froststream-typesense
    image: "typesense/typesense:30.2"
    environment:
      TYPESENSE_DATA_DIR: "/data"
      TYPESENSE_API_KEY: "${TYPESENSE_API_KEY}"
      TYPESENSE_ENABLE_CORS: "true"
    expose:
      - "8108"
    volumes:
      - type: "volume"
        target: "/data"
        source: "typesense-data"
        read_only: false
    networks:
      - "aspire"
  authentik:
    container_name: froststream-authentik
    image: "ghcr.io/goauthentik/server:2026.5.3"
    command:
      - "server"
    environment:
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
      AUTHENTIK_POSTGRESQL__HOST: "postgres"
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__USER: "${POSTGRES_USER}"
      AUTHENTIK_POSTGRESQL__PASSWORD: "${POSTGRES_PASSWORD}"
      AUTHENTIK_POSTGRESQL__NAME: "authentikdb"
      AUTHENTIK_BOOTSTRAP_EMAIL: "${AUTHENTIK_BOOTSTRAP_EMAIL}"
      AUTHENTIK_BOOTSTRAP_PASSWORD: "${AUTHENTIK_BOOTSTRAP_PASSWORD}"
      AUTHENTIK_BOOTSTRAP_TOKEN: "${AUTHENTIK_BOOTSTRAP_TOKEN}"
      AUTHENTIK_CLIENT_ID: "froststream-bff"
      AUTHENTIK_CLIENT_SECRET: "${AUTHENTIK_CLIENT_SECRET}"
    ports:
      - "25100:9000"
    volumes:
      - type: "bind"
        target: "/blueprints/froststream.yaml"
        source: "../AppHost/configs/authentik/blueprints/froststream.yaml"
        read_only: true
      - type: "bind"
        target: "/web/dist/assets/icons/froststream.svg"
        source: "../Frontend/static/favicon.svg"
        read_only: true
    depends_on:
      postgres:
        condition: "service_healthy"
      postgres-init:
        condition: "service_completed_successfully"
    networks:
      - "aspire"
    healthcheck:
      test:
        - "CMD"
        - "ak"
        - "healthcheck"
      interval: "10s"
      timeout: "30s"
      retries: 30
      start_period: "60s"
  authentik-worker:
    container_name: froststream-authentik-worker
    image: "ghcr.io/goauthentik/server:2026.5.3"
    command:
      - "worker"
    environment:
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
      AUTHENTIK_POSTGRESQL__HOST: "postgres"
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__USER: "${POSTGRES_USER}"
      AUTHENTIK_POSTGRESQL__PASSWORD: "${POSTGRES_PASSWORD}"
      AUTHENTIK_POSTGRESQL__NAME: "authentikdb"
      AUTHENTIK_BOOTSTRAP_TOKEN: "${AUTHENTIK_BOOTSTRAP_TOKEN}"
      AUTHENTIK_CLIENT_ID: "froststream-bff"
      AUTHENTIK_CLIENT_SECRET: "${AUTHENTIK_CLIENT_SECRET}"
    volumes:
      - type: "bind"
        target: "/blueprints/froststream.yaml"
        source: "../AppHost/configs/authentik/blueprints/froststream.yaml"
        read_only: true
    depends_on:
      postgres:
        condition: "service_healthy"
      postgres-init:
        condition: "service_completed_successfully"
      authentik:
        condition: "service_healthy"
    networks:
      - "aspire"
  openfga-migrate:
    container_name: froststream-openfga-migrate
    image: "openfga/openfga:v1.18.0"
    command:
      - "migrate"
    environment:
      OPENFGA_DATASTORE_ENGINE: "postgres"
      OPENFGA_DATASTORE_URI: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfgadb?sslmode=disable"
    depends_on:
      postgres:
        condition: "service_started"
      postgres-init:
        condition: "service_completed_successfully"
    networks:
      - "aspire"
  openfga:
    container_name: froststream-openfga
    image: "openfga/openfga:v1.18.0"
    command:
      - "run"
    environment:
      OPENFGA_DATASTORE_ENGINE: "postgres"
      OPENFGA_DATASTORE_URI: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfgadb?sslmode=disable"
    expose:
      - "8080"
    depends_on:
      openfga-migrate:
        condition: "service_completed_successfully"
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  openfga-studio:
    container_name: froststream-openfga-studio
    image: "ghcr.io/prakashm88/openfga-studio:latest"
    environment:
      DISABLE_LOCAL_OPENFGA: "true"
      OPENFGA_ENDPOINT: "http://openfga:8080"
    ports:
      - "25800:3000"
    depends_on:
      openfga:
        condition: "service_started"
    networks:
      - "aspire"
  pot-provider:
    container_name: froststream-pot-provider
    image: "brainicism/bgutil-ytdlp-pot-provider:1.3.1"
    expose:
      - "4416"
    networks:
      - "aspire"
  backupservice:
    container_name: froststream-backupservice
    image: "localhost/froststream-backupservice:latest"
    pull_policy: "build"
    build:
      context: "../.."
      dockerfile: "App/BackupService/Dockerfile"
    environment:
      ConnectionStrings__nats: "nats://nats:${NATS_PASSWORD}@nats:4222"
      NATS_HOST: "nats"
      NATS_PORT: "4222"
      NATS_USERNAME: "nats"
      NATS_PASSWORD: "${NATS_PASSWORD}"
      NATS_URI: "nats://nats:${NATS_PASSWORD}@nats:4222"
      ConnectionStrings__froststreamdb: "Host=postgres;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=froststreamdb"
      FROSTSTREAMDB_HOST: "postgres"
      FROSTSTREAMDB_PORT: "5432"
      FROSTSTREAMDB_USERNAME: "${POSTGRES_USER}"
      FROSTSTREAMDB_PASSWORD: "${POSTGRES_PASSWORD}"
      FROSTSTREAMDB_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/froststreamdb"
      FROSTSTREAMDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/froststreamdb"
      FROSTSTREAMDB_DATABASENAME: "froststreamdb"
      Backup__Directory: "/backups"
      Backup__Stanza: "froststream"
      Backup__PgDataPath: "/var/lib/postgresql/18/docker"
      Backup__PostgresHost: "postgres"
      Backup__PostgresPort: "5432"
      Backup__PostgresUser: "${POSTGRES_USER}"
      Backup__PostgresPassword: "${POSTGRES_PASSWORD}"
      Backup__OpenBaoAddress: "http://openbao:8200"
      Backup__OpenBaoToken: "${OPENBAO_TOKEN}"
      Backup__OpenBaoKvMount: "secret"
      Backup__RestoreUiToken: "${BACKUP_RESTORE_UI_TOKEN}"
      Backup__HostRoot: "${FROSTSTREAM_BACKUP_ROOT}"
    ports:
      - "25900:8081"
    expose:
      - "8080"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "froststream-postgres-data"
        read_only: false
      - type: "volume"
        target: "/var/run/postgresql"
        source: "froststream-postgres-socket"
        read_only: false
      - type: "bind"
        target: "/backups"
        source: "${FROSTSTREAM_BACKUP_ROOT:-./backups}"
      - type: "bind"
        target: "/etc/pgbackrest/pgbackrest.conf"
        source: "../AppHost/configs/pgbackrest/pgbackrest.conf"
        read_only: true
    depends_on:
      nats:
        condition: "service_started"
      postgres:
        condition: "service_started"
      postgres-init:
        condition: "service_completed_successfully"
      openbao-bootstrap:
        condition: "service_completed_successfully"
    networks:
      - "aspire"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fsS http://localhost:8080/health || exit 1"
      interval: "10s"
      timeout: "5s"
      retries: 12
      start_period: "20s"
  clickhouse:
    container_name: froststream-clickhouse
    image: "clickhouse/clickhouse-server:25.8"
    environment:
      CLICKHOUSE_DB: "froststream"
      CLICKHOUSE_USER: "froststream"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
    expose:
      - "8123"
    volumes:
      - type: "volume"
        target: "/var/lib/clickhouse"
        source: "clickhouse-data"
        read_only: false
    networks:
      - "aspire"
  databridge:
    container_name: froststream-databridge
    image: "localhost/froststream-databridge:latest"
    pull_policy: "build"
    build:
      context: "../.."
      dockerfile: "App/DataBridge/Dockerfile"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__froststreamdb: "Host=postgres;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=froststreamdb"
      FROSTSTREAMDB_HOST: "postgres"
      FROSTSTREAMDB_PORT: "5432"
      FROSTSTREAMDB_USERNAME: "${POSTGRES_USER}"
      FROSTSTREAMDB_PASSWORD: "${POSTGRES_PASSWORD}"
      FROSTSTREAMDB_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/froststreamdb"
      FROSTSTREAMDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/froststreamdb"
      FROSTSTREAMDB_DATABASENAME: "froststreamdb"
      ConnectionStrings__nats: "nats://nats:${NATS_PASSWORD}@nats:4222"
      NATS_HOST: "nats"
      NATS_PORT: "4222"
      NATS_USERNAME: "nats"
      NATS_PASSWORD: "${NATS_PASSWORD}"
      NATS_URI: "nats://nats:${NATS_PASSWORD}@nats:4222"
      OpenBao__Address: "http://openbao:8200"
      OpenBao__Token: "${OPENBAO_TOKEN}"
      Typesense__Url: "http://typesense:8108"
      Typesense__ApiKey: "${TYPESENSE_API_KEY}"
      FROSTSTREAM_STORAGE_ROOT: "/data"
      SINGLE_USER_MODE: "false"
      PotBroker__Enabled: "true"
      PotBroker__ProviderUrl: "http://pot-provider:4416"
      LiveChat__Enabled: "true"
      LiveChat__Url: "http://clickhouse:8123"
      LiveChat__Database: "froststream"
      LiveChat__User: "froststream"
      LiveChat__Password: "${CLICKHOUSE_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-docker-demo-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "databridge"
    volumes:
      - type: "volume"
        target: "/data"
        source: "froststream-data"
        read_only: false
    depends_on:
      postgres:
        condition: "service_started"
      postgres-init:
        condition: "service_completed_successfully"
      nats:
        condition: "service_started"
      openbao-bootstrap:
        condition: "service_completed_successfully"
      typesense:
        condition: "service_started"
      pot-provider:
        condition: "service_started"
      clickhouse:
        condition: "service_started"
    networks:
      - "aspire"
  webapi:
    container_name: froststream-webapi
    image: "localhost/froststream-webapi:latest"
    pull_policy: "build"
    build:
      context: "../.."
      dockerfile: "App/WebAPI/Dockerfile"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      ConnectionStrings__nats: "nats://nats:${NATS_PASSWORD}@nats:4222"
      NATS_HOST: "nats"
      NATS_PORT: "4222"
      NATS_USERNAME: "nats"
      NATS_PASSWORD: "${NATS_PASSWORD}"
      NATS_URI: "nats://nats:${NATS_PASSWORD}@nats:4222"
      DOTNET_ENVIRONMENT: "Development"
      OpenBao__Address: "http://openbao:8200"
      OpenBao__Token: "${OPENBAO_TOKEN}"
      FROSTSTREAM_STORAGE_ROOT: "/data"
      SINGLE_USER_MODE: "false"
      Auth__SingleUserMode: "false"
      Auth__AllowSingleUserModeInProduction: "false"
      Auth__Audience: "froststream-api"
      Auth__ClientId: "froststream-bff"
      Auth__ClientSecret: "${AUTHENTIK_CLIENT_SECRET}"
      Auth__Scopes: "openid profile email groups offline_access"
      Auth__PublicOrigin: "${FRONTEND_PUBLIC_ORIGIN}"
      Auth__PublicAuthority: "${AUTHENTIK_PUBLIC_AUTHORITY}"
      Auth__SecureCookies: "false"
      Auth__DataProtectionKeysPath: "/data-protection-keys"
      Auth__RequireHttpsMetadata: "false"
      Auth__ExposeOpenApi: "false"
      OpenFga__StoreId: ""
      OpenFga__AuthorizationModelId: ""
      OpenFga__AutoProvision: "true"
      OpenFga__BootstrapOwnerSubjects: ""
      Cast__AdvertisedBaseUrl: "${CAST_ADVERTISED_BASE_URL}"
      LiveChat__Enabled: "true"
      BackupService__BaseUrl: "http://backupservice:8080"
      Auth__Authority: "http://authentik:9000/application/o/froststream/"
      OpenFga__Endpoint: "http://openfga:8080"
      Authentik__ApiUrl: "http://authentik:9000"
      Authentik__ApiToken: "${AUTHENTIK_BOOTSTRAP_TOKEN}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-docker-demo-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "webapi"
    ports:
      - "25200:8080"
    expose:
      - "8080"
    volumes:
      - type: "volume"
        target: "/data"
        source: "froststream-data"
        read_only: false
      - type: "volume"
        target: "/data-protection-keys"
        source: "froststream-data-protection-keys"
        read_only: false
    depends_on:
      nats:
        condition: "service_started"
      databridge:
        condition: "service_started"
      openbao-bootstrap:
        condition: "service_completed_successfully"
      backupservice:
        condition: "service_healthy"
      authentik:
        condition: "service_healthy"
      openfga:
        condition: "service_started"
    networks:
      - "aspire"
  worker:
    container_name: froststream-worker
    image: "localhost/froststream-worker:latest"
    pull_policy: "build"
    build:
      context: "../.."
      dockerfile: "App/Worker/Dockerfile"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__nats: "nats://nats:${NATS_PASSWORD}@nats:4222"
      NATS_HOST: "nats"
      NATS_PORT: "4222"
      NATS_USERNAME: "nats"
      NATS_PASSWORD: "${NATS_PASSWORD}"
      NATS_URI: "nats://nats:${NATS_PASSWORD}@nats:4222"
      OpenBao__Address: "http://openbao:8200"
      OpenBao__Token: "${OPENBAO_TOKEN}"
      FROSTSTREAM_STORAGE_ROOT: "/data"
      PotProvider__Enabled: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-docker-demo-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "worker"
    volumes:
      - type: "volume"
        target: "/data"
        source: "froststream-data"
        read_only: false
    depends_on:
      nats:
        condition: "service_started"
      openbao-bootstrap:
        condition: "service_completed_successfully"
    networks:
      - "aspire"
  mediaprocessor:
    container_name: froststream-mediaprocessor
    image: "localhost/froststream-mediaprocessor:latest"
    pull_policy: "build"
    build:
      context: "../.."
      dockerfile: "App/MediaProcessor/Dockerfile"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__nats: "nats://nats:${NATS_PASSWORD}@nats:4222"
      NATS_HOST: "nats"
      NATS_PORT: "4222"
      NATS_USERNAME: "nats"
      NATS_PASSWORD: "${NATS_PASSWORD}"
      NATS_URI: "nats://nats:${NATS_PASSWORD}@nats:4222"
      MediaProcessor__WebApiBaseUrl: "http://webapi:8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-docker-demo-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "mediaprocessor"
    depends_on:
      nats:
        condition: "service_started"
      databridge:
        condition: "service_started"
      webapi:
        condition: "service_started"
    networks:
      - "aspire"
  scheduler:
    container_name: froststream-scheduler
    image: "localhost/froststream-scheduler:latest"
    pull_policy: "build"
    build:
      context: "../.."
      dockerfile: "App/Scheduler/Dockerfile"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      ConnectionStrings__nats: "nats://nats:${NATS_PASSWORD}@nats:4222"
      NATS_HOST: "nats"
      NATS_PORT: "4222"
      NATS_USERNAME: "nats"
      NATS_PASSWORD: "${NATS_PASSWORD}"
      NATS_URI: "nats://nats:${NATS_PASSWORD}@nats:4222"
      BackupService__BaseUrl: "http://backupservice:8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-docker-demo-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "scheduler"
    ports:
      - "25300:8080"
    depends_on:
      nats:
        condition: "service_started"
      databridge:
        condition: "service_started"
      backupservice:
        condition: "service_started"
    networks:
      - "aspire"
  frontend:
    container_name: froststream-frontend

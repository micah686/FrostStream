# FrostStream PostgreSQL configuration.
#
# Loaded via:  postgres -c config_file=/etc/postgresql/postgresql.conf
# (see src/App/AppHost/StartPostgres.cs). This replaces the server's default
# postgresql.conf, so it must set everything the container needs — hence
# listen_addresses below. PostgreSQL built-in defaults apply to anything omitted.
#
# Purpose: enable the physical backup + point-in-time-recovery features used by
# src/App/BackupService (pgBackRest full/diff backups + WAL archiving). See
# docs/Markdown/BACKUP_RESTORE.md.

# Accept connections from outside the container (Aspire maps the port to the host).
listen_addresses = '*'

# Use the checked-in HBA policy so normal and replication connections behave the
# same in Aspire and generated Docker Compose deployments.
hba_file = '/etc/postgresql/pg_hba.conf'

# --- Write-Ahead Log / replication ---------------------------------------------
# Required for physical backups. These match PostgreSQL's own defaults but are
# pinned here so the behavior is explicit and stable.
wal_level = replica
max_wal_senders = 10

# --- Continuous WAL archiving (PITR) -------------------------------------------
# archive_mode requires a server restart to take effect; Aspire recreates the
# container when this file changes. Each completed segment is pushed into the
# shared pgBackRest repository (/backups/pgbackrest bind mount, shared with the
# backupservice container). pgBackRest handles idempotency, compression, and
# checksums; configuration lives in /etc/pgbackrest/pgbackrest.conf (mounted from
# src/App/AppHost/configs/pgbackrest/pgbackrest.conf).
#
# archive-push fails (and PostgreSQL retries per segment) until the stanza has
# been created, which BackupService does automatically at startup.
archive_mode = on
archive_command = 'pgbackrest --stanza=froststream archive-push %p'

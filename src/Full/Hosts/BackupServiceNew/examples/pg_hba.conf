# Same-UID container-local Unix socket access for backup and on-demand validation.
# With an existing HBA, merge these before broader rules; preserve application rules.
local   all           postgres                         peer
local   replication   postgres                         peer
# Optional application TCP connections, using credentials managed outside this repo.
host    all           all         127.0.0.1/32          scram-sha-256
host    all           all         ::1/128               scram-sha-256

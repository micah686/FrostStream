# PostgreSQL 14+ example: run PostgreSQL and wrapper as the same postgres UID.
# Mount PGDATA, repository, socket and pgBackRest config at identical absolute paths
# for both PostgreSQL and the wrapper. Adjust all paths for your environment.
data_directory = '/var/lib/postgresql/18/docker'
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'
# Accept connections from outside the container (Aspire maps the port to the host).
listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
unix_socket_permissions = 0770
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --config=/etc/pgbackrest/pgbackrest.conf --stanza=main archive-push "%p"'
# Example only: choose segment switch frequency from your RPO and storage budget.
# This does not guarantee a 60-second recovery point under failures or backlog.
archive_timeout = '60s'
# Used for recovery and scratch validation. pgBackRest creates restore_command
# and recovery targets during restore; do not hard-code those here.
hot_standby = on
# Required to allow online physical backup connections; tune for other workloads.
max_wal_senders = 10
# Restart PostgreSQL after changing wal_level/archive_mode.

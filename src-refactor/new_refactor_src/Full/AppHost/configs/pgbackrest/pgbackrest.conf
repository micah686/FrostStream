# FrostStream pgBackRest configuration, mounted read-only at /etc/pgbackrest/pgbackrest.conf
# in BOTH the postgres container (archive_command = archive-push) and the backupservice
# container (backup/verify/restore). Both containers share the /backups bind mount (repo),
# the postgres data volume, and the /var/run/postgresql socket volume, so every operation is
# a "local" pgBackRest operation — no TLS/SSH repo-host mode.
#
# The PostgreSQL connection user is not set here: BackupService passes PGBACKREST_PG1_USER
# and PGPASSWORD from its Backup__Postgres* settings (archive-push needs no DB connection).
#
# Retention is enforced by pgBackRest itself (expire runs after every backup); these are the
# only retention knobs in the system.

[froststream]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql

[global]
repo1-path=/backups/pgbackrest
repo1-retention-full=4
repo1-retention-diff=14
compress-type=zst
start-fast=y
delta=y
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

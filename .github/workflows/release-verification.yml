name: Full and Lite release verification
on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Shared API, repositories, workflows, auth and recovery
        run: |
          dotnet run --project Tests/UnitTests -c Release -- --minimum-expected-tests 1 --results-directory "$RUNNER_TEMP/unit-results"
          dotnet run --project Tests/IntegrationTests/IntegrationTests -c Release -- --minimum-expected-tests 1 --results-directory "$RUNNER_TEMP/integration-results"
      - name: Shared frontend access and type checks
        working-directory: src/App/SharedApp/Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test:access
          pnpm test:backups
          pnpm build
  packages:
    needs: shared-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install publisher and profile checker
        run: |
          curl -fsSL https://aspire.dev/install.sh -o "$RUNNER_TEMP/install-aspire.sh"
          bash "$RUNNER_TEMP/install-aspire.sh" --version 13.4.6
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
          python3 -m pip install PyYAML==6.0.2
      - name: Generate and check both service graphs with optional ClickHouse
        run: |
          cp src/App/profiles.env.example "$RUNNER_TEMP/profiles.env"
          sed -i 's/LIVE_CHAT_ENABLED=false/LIVE_CHAT_ENABLED=true/' "$RUNNER_TEMP/profiles.env"
          FROSTSTREAM_ENV_FILE="$RUNNER_TEMP/profiles.env" bash src/App/generateProfiles.sh
          python3 src/App/SharedApp/deployment/verify_profiles.py --live-chat
      - name: Generate default release profiles
        run: |
          FROSTSTREAM_ENV_FILE="$GITHUB_WORKSPACE/src/App/profiles.env.example" bash src/App/generateProfiles.sh
          python3 src/App/SharedApp/deployment/verify_profiles.py
      - name: Package source, generated profiles and matching operating guides
        run: python3 src/App/SharedApp/deployment/package_release.py --output "$RUNNER_TEMP/release"
      - name: Verify installation from the actual archive on fresh storage
        run: |
          mkdir "$RUNNER_TEMP/install"
          tar -xzf "$RUNNER_TEMP/release/froststream-release.tar.gz" -C "$RUNNER_TEMP/install"
          cd "$RUNNER_TEMP/install/froststream"
          FROSTSTREAM_ENV_FILE="$PWD/src/App/profiles.env.example" bash src/App/generateProfiles.sh
          python3 src/App/SharedApp/deployment/verify_profiles.py
          python3 src/App/SharedApp/deployment/smoke_profiles.py
      - name: Export verified application images
        run: python3 src/App/SharedApp/deployment/export_images.py --output "$RUNNER_TEMP/release" --architecture "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: froststream-release-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: froststream-release-*
          path: downloads
      - name: Publish verified release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          cp downloads/froststream-release-amd64/froststream-release.tar.gz release/
          cp downloads/froststream-release-*/froststream-images-linux-*.tar.gz release/
          cd release
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" ./* --verify-tag --generate-notes

name: Build and test

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared:
    name: Shared and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      typesense:
        image: typesense/typesense:30.2
        env:
          TYPESENSE_API_KEY: phase4-test-key
          TYPESENSE_DATA_DIR: /tmp
        ports:
          - 8108:8108
    env:
      FROSTSTREAM_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=test-password
      FROSTSTREAM_TEST_TYPESENSE: http://127.0.0.1:8108
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build solution
        run: dotnet build FrostStream.slnx --configuration Release --nologo -m:1
      - name: Run unit tests
        run: dotnet run --no-build --project src/Tests/UnitTests/UnitTests.csproj --configuration Release -- --minimum-expected-tests 1 --maximum-parallel-tests 4 --results-directory "$RUNNER_TEMP/unit-results" --coverage --coverage-output "$RUNNER_TEMP/unit-results/coverage.cobertura.xml" --coverage-output-format cobertura
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-results
          path: ${{ runner.temp }}/unit-results/
          if-no-files-found: ignore

  editions:
    name: ${{ matrix.edition }} build and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: Full
            project: src/Full/AppHost/AppHostFull.csproj
          - edition: Lite
            project: src/Lite/AppHost/AppHostLite.csproj
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build edition
        run: dotnet build '${{ matrix.project }}' --configuration Release --nologo -m:1
      - name: Build integration tests
        run: dotnet build src/Tests/IntegrationTests/IntegrationTests/IntegrationTests.csproj --configuration Release --nologo -m:1
      - name: Install ReportGenerator
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path "$RUNNER_TEMP/tools" --version 5.5.12
      # Full runs the complete integration suite, including shared tests. Lite gets its
      # own independent run so its failures are visible even when Full fails.
      - name: Run Full and shared integration tests
        if: matrix.edition == 'Full'
        run: dotnet run --no-build --project src/Tests/IntegrationTests/IntegrationTests/IntegrationTests.csproj --configuration Release -- --minimum-expected-tests 1 --maximum-parallel-tests 4 --results-directory "$RUNNER_TEMP/integration-results" --coverage --coverage-output "$RUNNER_TEMP/integration-results/coverage.cobertura.xml" --coverage-output-format cobertura
      - name: Run Lite integration tests
        if: matrix.edition == 'Lite'
        run: dotnet run --no-build --project src/Tests/IntegrationTests/IntegrationTests/IntegrationTests.csproj --configuration Release -- --minimum-expected-tests 1 --maximum-parallel-tests 4 --treenode-filter '/*/IntegrationTests.Lite/*/*' --results-directory "$RUNNER_TEMP/integration-results" --coverage --coverage-output "$RUNNER_TEMP/integration-results/coverage.cobertura.xml" --coverage-output-format cobertura
      - name: Generate ${{ matrix.edition }} coverage report
        if: always()
        shell: bash
        run: |
          coverage_file="$RUNNER_TEMP/integration-results/coverage.cobertura.xml"
          if [[ -f "$coverage_file" ]]; then
            "$RUNNER_TEMP/tools/reportgenerator" \
              "-reports:$coverage_file" \
              "-targetdir:$RUNNER_TEMP/coverage-report" \
              "-reporttypes:Html;MarkdownSummaryGithub" \
              "-title:${{ matrix.edition }} integration coverage"
            if [[ -f "$RUNNER_TEMP/coverage-report/SummaryGithub.md" ]]; then
              cat "$RUNNER_TEMP/coverage-report/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Coverage data was not produced; skipping HTML report generation."
          fi
      - name: Upload ${{ matrix.edition }} coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.edition }}
          path: ${{ runner.temp }}/coverage-report/
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-${{ matrix.edition }}
          path: ${{ runner.temp }}/integration-results/
          if-no-files-found: ignore

  frontend:
    name: Shared frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/Frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: src/Frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:access
      - run: pnpm test:backups
      - run: pnpm build
